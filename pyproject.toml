[project]
name = "zpl-core"
version = "0.1.0"
description = "ZPL II engine: build, validate, render and send Zebra labels. Stdlib-only core with optional render/OCR extras."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Beny Shen" }]
keywords = ["zpl", "zebra", "label", "barcode", "printer", "link-os", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Printing",
]

[project.optional-dependencies]
render = ["pillow>=10.0", "segno>=1.5", "python-barcode>=0.15"]
ocr = [
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
    "zxing-cpp>=2.2",
    "onnxruntime>=1.17",
    "pyclipper>=1.3",
]
all = ["zpl-core[render,ocr]"]

[project.urls]
Homepage = "https://github.com/benyshen/zpl-core"
Upstream = "https://github.com/benyshen/zebra-printer-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zpl_core"]

[tool.hatch.build.targets.sdist]
include = ["src/zpl_core", "tests", "README.md", "LICENSE"]
